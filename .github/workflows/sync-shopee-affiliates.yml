name: Sync Shopee Affiliate Links

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/shopee-sync-trigger"

permissions:
  contents: write

concurrency:
  group: shopee-affiliate-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate credentials
        env:
          SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
          SHOPEE_SECRET: ${{ secrets.SHOPEE_SECRET }}
        run: |
          test -n "$SHOPEE_APP_ID" || (echo "Secret SHOPEE_APP_ID ausente" && exit 1)
          test -n "$SHOPEE_SECRET" || (echo "Secret SHOPEE_SECRET ausente" && exit 1)

      - name: Sync official Shopee offer links
        env:
          SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
          SHOPEE_SECRET: ${{ secrets.SHOPEE_SECRET }}
          SHOPEE_BATCH_SIZE: "20"
          SHOPEE_DELAY_MS: "450"
        run: node scripts/sync-shopee-openapi.js

      - name: Commit affiliate map
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/shopee-affiliate-map.json public/data/catalog-meta.json
          if git diff --cached --quiet; then
            echo "Nenhum link novo."
            exit 0
          fi
          git commit -m "Sincroniza links oficiais Shopee via Open API [skip ci]"
          git push
