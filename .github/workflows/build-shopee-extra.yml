name: Build Shopee Extra Catalog

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild plain Shopee catalog
        shell: bash
        run: |
          python - <<'PY'
          import base64, gzip, json, pathlib

          base = pathlib.Path("public/data/shopee")
          parts = []
          for i in range(1, 17):
              p = base / f"add1000-{i:02d}.txt"
              parts.append(p.read_text(encoding="utf-8").strip())

          compact = json.loads(gzip.decompress(base64.b64decode("".join(parts))).decode("utf-8"))
          categories = compact.get("c", [])
          rows = compact.get("p", [])

          if len(rows) != 1000:
              raise SystemExit(f"Esperado 1000 produtos, encontrado {len(rows)}")

          products = []
          for item in rows:
              item_id = str(item[0])
              shop_id = str(item[1])
              product_url = f"https://shopee.com.br/product/{shop_id}/{item_id}"
              image_url = f"https://cf.shopee.com.br/file/{item[3]}"
              products.append({
                  "id": item_id,
                  "nome": item[2],
                  "marca": "Shopee",
                  "imagem": image_url,
                  "imagens": [image_url],
                  "categoria": categories[item[4]] if item[4] < len(categories) else "Utilidades",
                  "marketplace": "Shopee",
                  "affiliateUrl": "https://shope.ee/an_redir?origin_link=" + __import__("urllib.parse").parse.quote(product_url, safe=""),
                  "productUrl": product_url,
                  "affiliateStatus": "approved",
                  "preco": float(item[5]),
                  "moeda": "BRL",
                  "origemSelecao": "SHOPEE_DATAFEED_OFICIAL_EXTRA"
              })

          payload = {
              "marketplace": "Shopee",
              "quantidade": len(products),
              "produtos": products
          }

          (base / "extra-1000.json").write_text(
              json.dumps(payload, ensure_ascii=False, separators=(",", ":")),
              encoding="utf-8"
          )
          PY

      - name: Commit generated catalog
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/shopee/extra-1000.json
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Gera catálogo Shopee extra com 1000 produtos [skip ci]"
          git push
